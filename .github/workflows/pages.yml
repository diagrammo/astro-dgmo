name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /astro-dgmo/
      # The showcase redraws a changed live link in place rather than showing the
      # "this diagram has been updated" notice the default ships. On a page whose
      # argument is that the diagram is current, the notice is the one element
      # that fails to demonstrate the thing. Costs +740 gzipped bytes eagerly and
      # 641 KB fetched only when a diagram has actually changed — measured
      # 2026-08-03; `pnpm test:e2e` prints the eager number on every run.
      #
      # This is the ONLY place it is on. The default every adopter gets is
      # `notify`, and the committed fixture keeps building that way so the
      # bundle-size baseline keeps guarding it.
      LIVE_LINK_REFRESH: render
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build wrapper
        run: pnpm build

      - name: Install fixture deps
        run: cd tests/fixture && pnpm install --no-frozen-lockfile

      - name: Compose showcase page (live links + all chart types from dgmo-content)
        run: node scripts/compose-showcase.mjs tests/fixture/src/pages/index.md

      - name: Build site
        run: cd tests/fixture && pnpm exec astro build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: tests/fixture/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
