name: CI

# Pull requests only, plus a manual run (diagrammo/diagrammo#1821). Every push
# to main has already passed .githooks/pre-push, which runs this job's install,
# check:all, typecheck, test and build steps, so a push-triggered run repeated
# them and spent the org's free Actions minutes — the org budget hard-stops
# every workflow once those are gone.
#
# What only this workflow proves, kept here on purpose: a clean ubuntu machine
# with an empty store, and `pnpm test:e2e` (the fixture site build with a
# non-frozen registry install, too slow and network-bound for the gate). A pull
# request is where those still earn their minutes: Dependabot's, and
# dependabot-automerge.yml, which already fires only on a CI run whose event is
# pull_request. To run them on main before a release, start this workflow by
# hand (workflow_dispatch).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Hygiene checks (formatting, dead code, duplication, deps)
        run: pnpm check:all

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Fixture build (e2e)
        run: pnpm test:e2e
